<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heyo</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel" id="panel">
    <header class="top">
      <button class="profile-btn" id="profileBtn" title="Switch profile (Tab)">
        <span class="dot"></span>
        <span id="profileName">—</span>
        <span class="hk" id="profileHotkey"></span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="meta">
        <span id="modelTag"></span>
        <button class="icon-btn" id="newConvBtn" title="New chat (Ctrl+N)" aria-label="New chat">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7 3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <ul class="menu hidden" id="menu" role="listbox"></ul>

    <section class="history hidden" id="history"></section>

    <div class="selection hidden" id="selection">
      <span class="sel-label">Selection</span>
      <span class="sel-text" id="selText"></span>
      <button class="icon-btn small" id="selClear" title="Don't use the selection" aria-label="Don't use the selection">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="input-row">
      <textarea id="input" rows="1" spellcheck="true" autocomplete="off"></textarea>
      <button class="icon-btn mic hidden" id="micBtn" title="Dictate (Ctrl+M)" aria-label="Dictate" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="status hidden" id="status">
      <span class="pulse"></span><span id="statusText">Thinking…</span>
      <span class="spacer"></span><span class="hint"><kbd>Esc</kbd> cancel</span>
    </div>

    <div class="error hidden" id="error"></div>

    <section class="answer hidden" id="answer">
      <div class="answer-text" id="answerText"></div>
      <div class="answer-actions">
        <button class="chip primary" id="insertBtn">Insert <kbd id="insertKbd">Ctrl ↵</kbd></button>
        <button class="chip" id="copyBtn">Copy</button>
      </div>
    </section>

    <footer class="hints" id="hints"></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
