<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoppy</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel" id="panel">
    <header class="top">
      <button class="profile-btn" id="profileBtn" title="Switch profile (Tab)" aria-haspopup="listbox" aria-expanded="false">
        <span class="picon" id="profileIcon"><span class="dot"></span></span>
        <span class="label">
          <span class="name" id="profileName">—</span>
          <span class="hk" id="profileHotkey"></span>
          <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div class="meta">
        <span id="modelTag"></span>
        <button class="icon-btn" id="newConvBtn" title="New chat (Ctrl+N)" aria-label="New chat">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="update hidden" id="update">
      <span id="updateText"></span>
      <button class="chip primary" id="updateBtn">Install and restart</button>
    </div>

    <ul class="menu hidden" id="menu" role="listbox"></ul>

    <section class="history hidden" id="history"></section>

    <div class="chips">
      <div class="selection hidden" id="selection">
        <span class="sel-label">Selection</span>
        <span class="sel-text" id="selText"></span>
        <button class="icon-btn small" id="selClear" title="Don't use the selection" aria-label="Don't use the selection">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="selection shot hidden" id="shot">
        <svg class="shot-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="3" width="12.4" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="sel-label">Screenshot attached</span>
        <span class="sel-text"></span>
        <button class="icon-btn small" id="shotClear" title="Don't send the screenshot" aria-label="Don't send the screenshot">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="input-row">
      <textarea id="input" rows="1" spellcheck="true" autocomplete="off"></textarea>
      <button class="icon-btn mic hidden" id="micBtn" title="Dictate (Ctrl+M)" aria-label="Dictate" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="status listening hidden" id="listening">
      <span class="rec"></span><span id="listenText">Listening…</span>
      <span class="spacer"></span><span class="hint"><kbd id="listenKbd">Ctrl M</kbd> stop</span>
    </div>

    <div class="status hidden" id="status">
      <span class="pulse"></span><span id="statusText">Thinking…</span>
      <span class="spacer"></span><span class="hint"><kbd>Esc</kbd> cancel</span>
    </div>

    <div class="error hidden" id="error"></div>

    <section class="answer hidden" id="answer">
      <p class="answer-note hidden" id="answerNote"></p>
      <div class="answer-text" id="answerText"></div>
      <div class="answer-actions">
        <button class="chip primary" id="insertBtn">Insert <kbd id="insertKbd">Ctrl ↵</kbd></button>
        <button class="chip" id="copyBtn">Copy</button>
      </div>
    </section>

    <footer class="hints" id="hints"></footer>
  </main>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
