[package]
name = "heyo"
version = "0.1.0"
description = "Summon AI anywhere with a shortcut or a mouse button"
edition = "2024"

[lib]
name = "heyo"
crate-type = ["rlib"]

[dependencies]
device_query = "4.0.1"
enigo = "0.6.1"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
uuid = { version = "1.29.3", features = ["v4"] }

[build-dependencies]
tauri-build = "2.7.6"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
# Only for reading the text caret through accessibility (MSAA) in apps without a Win32 caret.
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
