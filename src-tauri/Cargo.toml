[package]
name = "hoppy"
version = "0.3.0"
description = "Summon AI anywhere with a shortcut or a mouse button"
edition = "2024"

[lib]
name = "hoppy"
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
device_query = "4.0.1"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
uuid = { version = "1.29.3", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm"] }
# WinRT/COM: text caret through accessibility (MSAA) and the built-in speech recognizer.
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Foundation", "Foundation_Collections", "Globalization", "Media_SpeechRecognition"] }

# Screen capture for profiles that attach a screenshot (Linux: not supported yet).
[target."cfg(any(windows, target_os = \"macos\"))".dependencies]
xcap = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
